appId: app.openroll.desktop
productName: OpenRoll
copyright: Copyright 2026 OpenRoll contributors, GPL-3.0-or-later
asar: true
compression: normal
electronLanguages: [en-US, sv]
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules"
  - "!node_modules/**"
# ffmpeg and ffprobe for this os and arch, fetched by scripts/fetch-ffmpeg.mjs.
extraResources:
  - { from: "resources/ffmpeg/${os}-${arch}", to: ffmpeg, filter: ["**/*", "!.stamp.json"] }
afterPack: build/after-pack.mjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.video
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  identity: null
  icon: build/icon.icns
  darkModeSupport: true
dmg:
  title: OpenRoll ${version}
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - { target: nsis, arch: [x64] }
    - { target: portable, arch: [x64] }
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${os}-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}

linux:
  target:
    - { target: AppImage, arch: [x64] }
    - { target: deb, arch: [x64] }
  icon: build/icon.png
  category: AudioVideo
  syncDesktopName: true
  maintainer: OpenRoll contributors
  synopsis: A free, open source video editor
appImage:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
