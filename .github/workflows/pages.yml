name: Site

# Publishes site/ to openroll.dev, with the install scripts served at /install and /install.ps1.
on:
  push:
    branches: [main]
    paths: [site/**, install.sh, install.ps1, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir _site
          cp -R site/. _site/
          cp install.sh _site/install
          cp install.ps1 _site/install.ps1
          echo openroll.dev > _site/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
